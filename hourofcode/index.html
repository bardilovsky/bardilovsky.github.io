  <script>

    (function() {
      var eventTime = moment([2017, 11, 4]); 
      var currentTime = moment(); 
      var diffTime = eventTime.diff(currentTime);
      var duration = moment.duration(diffTime, 'milliseconds');
      var interval = 1000;
      var names = [
        ["день","дня","дней"],
        ["час","часа","часов"],
        ["минута","минуты","минут"],
        ["секунда","секунды","секунд"],
      ]
      
      var days = $('#countDays');
      var hours = $('#countHours');
      var minuts = $('#countMinutes');
      var seconds = $('#countSeconds');

      function splitByDigits (val, arr){
        var result = "";
        var slicer = val.toString();
        var slicer_min = parseInt(slicer.slice(-1));

        result = "<span>" + slicer + " </span>";

        if(slicer_min == 1 && (val < 10 || val > 20)) {
          result += '<span>'+ arr[0] +'</span>'
        } else if((slicer_min == 2 || slicer_min == 3 || slicer_min == 4) && (val < 10 || val > 20)) {
          result += '<span>'+ arr[1] +'</span>'
        } else  {
          result += '<span>'+ arr[2] +'</span>'
        }
        return result;
      }

      function splitDigits (val,label, length){
         var result = "";
          var slicer = Math.floor(val).toString();

          if (val < 10) {
            slicer = '0' + slicer;
          }

          if (slicer && slicer.length) {
            for (var i=0; i<slicer.length; i++) {
              result += "<span>" + slicer[i] + "</span>";
              // result += '<span>${slicer[i]}</span>';
            }
          }
          result += '<div>'+ label +'</div>'
         
          return result;
      }

      function countMe () {
        duration = moment.duration(duration - interval, 'milliseconds');
        days.html(splitByDigits (duration.days(), names[0]));
        hours.html(splitDigits (duration.asHours(), 'ч.')); //length
        minuts.html(splitDigits (duration.minutes(), 'мин.'));
        seconds.html(splitDigits (duration.seconds(), 'сек.'));
      }

      countMe ();

      
      setInterval(function(){
        countMe ()
      }, interval);

      $('.c-countdown-newindex').addClass('active')
    })();
  </script>
